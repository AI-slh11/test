services:
  - type: web
    name: rendezvous-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: FRONTEND_ORIGIN
        sync: false
      - key: ADMIN_CODE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
