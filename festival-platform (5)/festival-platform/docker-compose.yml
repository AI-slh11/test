version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    volumes:
      - backend_data:/app/data
    environment:
      - PORT=4000
      - ADMIN_CODE=${ADMIN_CODE:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:4000/api
        VITE_SOCKET_URL: http://localhost:4000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  backend_data:
